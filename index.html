<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Un tablero Kanban al estilo Trello que corre entero en el navegador: múltiples tableros, arrastrar y soltar, vista de calendario y copia de seguridad en JSON. Sin backend ni cuenta: tus datos se quedan en tu navegador."
    />
    <meta name="author" content="Gonzalo Martinez Garcia" />
    <title>Tablero Kanban</title>
    <!-- Social preview: the build writes the title, the description and the absolute addresses from
         tooling/agent-files/site.ts; the values here only serve the dev server. Image paths are root-relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Tablero Kanban" />
    <meta
      property="og:description"
      content="Un tablero Kanban al estilo Trello que corre entero en el navegador: múltiples tableros, arrastrar y soltar, vista de calendario y copia de seguridad en JSON. Sin backend ni cuenta: tus datos se quedan en tu navegador."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kanban Board: the app name, the tagline “A Trello-style board that runs fully in your browser” and its stack, React, TypeScript, Zustand and Feature-Sliced Design, over a dark board of columns and cards."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-cover.png" />
    <meta
      name="twitter:image:alt"
      content="Kanban Board: the app name, the tagline “A Trello-style board that runs fully in your browser” and its stack, React, TypeScript, Zustand and Feature-Sliced Design, over a dark board of columns and cards."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="app-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      media="print"
    />
    <!-- Theme and non-blocking fonts: paint the saved or system theme before the app loads so dark
         visitors never see a white screen and .app-startup is visible from the first frame
         (store.test.ts runs this script). -->
    <script>
      ;(function () {
        var theme = null
        try {
          var raw = localStorage.getItem('theme-preference')
          var parsed = raw ? JSON.parse(raw) : null
          var stored = parsed && parsed.state ? parsed.state.theme : null
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          }
        } catch (blocked) {
          // Site data is blocked or malformed: follow the system.
        }
        if (theme === null) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
        var fonts = document.getElementById('app-fonts')
        if (fonts) {
          if (fonts.sheet) {
            fonts.media = 'all'
          } else {
            fonts.addEventListener('load', function () {
              fonts.media = 'all'
            })
          }
        }
      })()
    </script>
    <!-- Available before the app CSS/JS. Scoped to the initial shell and temporary root content that React replaces. -->
    <style>
      html {
        color-scheme: light;
        background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 50%, #f5f3ff 100%) fixed;
        background-color: #f0f4ff;
        color: #18181b;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background: linear-gradient(135deg, #0f0d1a 0%, #18181b 50%, #1e1b4b 100%) fixed;
        background-color: #0f0d1a;
        color: #fafafa;
      }
      body {
        margin: 0;
      }
      .app-startup {
        box-sizing: border-box;
        min-height: 100svh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        color: inherit;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      .app-startup-brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      .app-startup progress {
        appearance: none;
        box-sizing: border-box;
        width: 2rem;
        height: 2rem;
        border: 3px solid color-mix(in srgb, currentColor 20%, transparent);
        border-top-color: #6366f1;
        border-radius: 50%;
        background: transparent;
        color: inherit;
      }
      html[data-theme='dark'] .app-startup progress {
        border-top-color: #818cf8;
      }
      .app-startup progress::-webkit-progress-bar {
        display: none;
      }
      .app-startup progress::-webkit-progress-value {
        display: none;
      }
      .app-startup progress::-moz-progress-bar {
        display: none;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-startup progress {
          animation: startup-spin 1s linear infinite;
        }
      }
      @media print {
        .app-startup progress {
          display: none;
        }
      }
    </style>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      />
      <style>
        .app-startup {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <main class="app-startup">
        <p class="app-startup-brand">Tablero Kanban</p>
        <progress aria-label="Cargando Tablero Kanban"></progress>
      </main>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
