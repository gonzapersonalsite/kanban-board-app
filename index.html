<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Un tablero Kanban al estilo Trello que corre entero en el navegador: múltiples tableros, arrastrar y soltar, vista de calendario y copia de seguridad en JSON. Sin backend ni cuenta: tus datos se quedan en tu navegador."
    />
    <meta name="author" content="Gonzalo Martinez Garcia" />
    <title>Tablero Kanban</title>
    <!-- Social preview: the build writes the title, the description and the absolute addresses from
         tooling/agent-files/site.ts; the values here only serve the dev server. Image paths are root-relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Tablero Kanban" />
    <meta
      property="og:description"
      content="Un tablero Kanban al estilo Trello que corre entero en el navegador: múltiples tableros, arrastrar y soltar, vista de calendario y copia de seguridad en JSON. Sin backend ni cuenta: tus datos se quedan en tu navegador."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kanban Board: the app name, the tagline “A Trello-style board that runs fully in your browser” and its stack, React, TypeScript, Zustand and Feature-Sliced Design, over a dark board of columns and cards."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-cover.png" />
    <meta
      name="twitter:image:alt"
      content="Kanban Board: the app name, the tagline “A Trello-style board that runs fully in your browser” and its stack, React, TypeScript, Zustand and Feature-Sliced Design, over a dark board of columns and cards."
    />
    <!-- Available before the app CSS/JS. Scoped to the temporary root content that React replaces. -->
    <style>
      .app-startup {
        box-sizing: border-box;
        min-height: calc(100svh - 16px);
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.5rem;
        padding: 2rem 1rem;
        color: CanvasText;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      .app-startup-brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      .app-startup progress {
        appearance: none;
        box-sizing: border-box;
        width: 2rem;
        height: 2rem;
        border: 3px solid color-mix(in srgb, currentColor 20%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        background: transparent;
        color: inherit;
      }
      .app-startup progress::-webkit-progress-bar {
        display: none;
      }
      .app-startup progress::-webkit-progress-value {
        display: none;
      }
      .app-startup progress::-moz-progress-bar {
        display: none;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-startup progress {
          animation: startup-spin 1s linear infinite;
        }
      }
      @media print {
        .app-startup progress {
          display: none;
        }
      }
    </style>
    <noscript>
      <style>
        .app-startup {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <main class="app-startup">
        <p class="app-startup-brand">Tablero Kanban</p>
        <progress aria-label="Cargando Tablero Kanban"></progress>
      </main>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
